# bridge/events.toml — inventário versionado das rotas do Ezio.
#
# Fonte da verdade do que o bridge (127.0.0.1:8009) enxerga. O bridge nasce como
# polling + diff (docs/architecture/MIKE_EZIO_BRIDGE.md §1/§2), então "evento" é o
# resultado de comparar dois snapshots — esta lista diz QUAIS rotas entram no
# snapshot e QUAIS eventos cada uma pode originar.
#
# REGRA DURA: rota ausente daqui = rota não classificada = o MIKE fica cego
# quando a rota aparecer. tests/test_control_endpoints.py quebra quando uma rota
# nova surgir em src/agent_server/{endpoints,main,auth,control_endpoints}.py sem
# entrada aqui — é a mitigação do risco registrado em §9 do plano.
#
# class:
#   command  — rota de comando chamada pelo bridge (allowlist, default-deny)
#   poll     — leitura amostrada; diff contra o snapshot gera evento
#   stream   — NDJSON/SSE; NÃO consumida (polling+diff é a decisão, §1)
#   internal — existe e é legível, mas o bridge não usa
#   deny     — proibida ao MIKE: credencial, freeze, env, atestação de fato, evidência
#   static   — UI/assets (o bridge nunca faz proxy de frontend, §2)

[meta]
version = 1
updated_at = "2026-09-11"
default_policy = "unclassified"
snapshot_poll_interval_s = 30
plan = "docs/architecture/MIKE_EZIO_BRIDGE.md"
route_sources = [
  "src/agent_server/endpoints.py",
  "src/agent_server/main.py",
  "src/agent_server/auth.py",
  "src/agent_server/control_endpoints.py",
]
classes = ["command", "poll", "stream", "internal", "deny", "static"]
event_envelope = ["event_type", "seq", "ts", "source", "payload", "snapshot_id"]

# Vocabulário fechado de event_type. Um "emits" fora daqui é erro de digitação.
[events]
"ezio.boot" = "primeiro snapshot depois do bridge subir"
"ezio.restarted" = "boot_id novo: o Ezio reiniciou, o bridge re-baseia o snapshot"
"ezio.degraded" = "/health (ou details) saiu de ok"
"ezio.recovered" = "/health voltou para ok"
"ezio.cockpit.changed" = "/cockpit/summary mudou"
"ezio.broker.changed" = "/cockpit/portfolio mudou (conexão, posições ou ordens)"
"ezio.mangala.changed" = "mangala mudou"
"ezio.trade.journal_changed" = "/trades/history mudou (trade novo, status novo)"
"ezio.sentiment.alert" = "alerta de sentimento novo"
"ezio.task.state_changed" = "task ativa mudou de estado"
"ezio.paper.approval_pending" = "aprovação de paper pendente no cockpit"
"ezio.command.settled" = "/control/commands respondeu applied/rejected/unknown"
"ezio.command.denied" = "/control/commands recusou (401/403/503)"

# Contrato de comando (Fase 2), espelhado em src/agent_server/control_endpoints.py.
# tests/test_control_endpoints.py compara as duas listas — divergência quebra o teste.
[commands]
route = "POST /control/commands"
policy = "default-deny"
allowed = ["bob.ibkr.recover", "feedback", "task.cancel", "task.submit"]
forbidden_families = [
  "freeze",
  "env",
  "trade/manual",
  "trade/execute",
  "paper/approve|reject",
  "evidence",
  "shell|exec|eval|python|subprocess",
]

# Rotas. Chave = "METHOD /path", exatamente como no decorador.
# snapshot = true → entra no snapshot base §2; false → consulta sob demanda.
[routes]
"GET /" = { class = "static", snapshot = false, mutable = false, bridge_calls = false, emits = [], source = "src/agent_server/main.py:789", note = "cockpit HTML; o bridge nunca faz proxy de frontend (§2)" }
