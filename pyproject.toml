[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "superezio"
version = "3.0.0"
description = "SuperEzio - AI Financial Analysis Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.0",
    "numpy>=1.24,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "langgraph>=1.0.5",
    "redis>=5.0",
    "mem0ai>=0.1",
    "lxml>=5.0",
    "yfinance>=0.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "sse-starlette>=1.8",
    "statsmodels>=0.14",
    "curl-cffi>=0.6",
    "duckduckgo-search>=5.0",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_server*", "core*", "data*", "experts*", "f51*", "tools*", "adapters*"]
