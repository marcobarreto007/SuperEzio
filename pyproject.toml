[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "superezio"
version = "4.0.0"
description = "SuperEzio — AI Financial Analysis Platform (CEO: Gemma-4-26B-A4B-abliterated)"
requires-python = ">=3.11"
dependencies = [
    # ── Core runtime ──
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=1.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",

    # ── AI / ML ──
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "llama-cpp-python>=0.3.23",
    "openai>=1.0",
    "langgraph>=1.0.5",

    # ── Broker execution ──
    "alpaca-py>=0.30",
    "ib-insync>=0.4",

    # ── Data & Math ──
    "pandas>=2.0",
    "numpy>=1.24,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pandas-ta>=0.3",
    "joblib>=1.3",

    # ── Data providers ──
    "lxml>=5.0",
    "textblob>=0.17",
    "duckduckgo-search>=5.0",
    "redis>=5.0",

    # ── Storage & infra ──
    "mem0ai>=0.1",

    # ── Dev / test ──
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_server*", "core*", "data*", "experts*", "f51*", "tools*", "adapters*"]
