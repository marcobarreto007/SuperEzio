[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superezio"
version = "4.0.0"
description = "SuperEzio - AI Financial Analysis Platform (CEO: Bob Core local)"
requires-python = ">=3.11"
dependencies = [
    # â”€â”€ Core runtime â”€â”€
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=1.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2",

    # â”€â”€ AI / ML â”€â”€
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "llama-cpp-python>=0.3.23",
    "openai>=1.0",
    "langgraph>=1.0.5",

    # â”€â”€ Broker execution â”€â”€
    "alpaca-py>=0.30",
    "ib-insync>=0.4",

    # â”€â”€ Data & Math â”€â”€
    "pandas>=2.0",
    "numpy>=1.24,<2.6",
    "scipy>=1.11",
    "scikit-learn>=1.3",

    # â”€â”€ Data providers â”€â”€
    "textblob>=0.17",
    "duckduckgo-search>=5.0",
    "redis>=5.0",

    # â”€â”€ Storage & infra â”€â”€

    # â”€â”€ Quality Engineering 2026 â”€â”€
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.21",
    "tenacity>=9.0",

    # â”€â”€ Dev / test â”€â”€
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "playwright>=1.45",
    "hypothesis>=6.100",
    "coverage>=7.6",
    "bandit>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/core/sentiment/curator.py" = ["E402"]
"src/core/sentiment/live_monitor.py" = ["E402"]
"src/core/sentiment/watchlist_pulse.py" = ["E402"]
"src/core/trading/trading_engine.py" = ["E402"]
"src/core/trading/trading_engine_live.py" = ["E402"]
"tests/run_fiduciary_battery.py" = ["E402"]
"tests/test_graph_memory_fase4.py" = ["E402"]
"tests/test_hybrid_memory_fase2.py" = ["E402"]
"tests/test_reranker_fase3.py" = ["E402"]
"tests/test_unified_memory_fase1.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_server*", "core*", "data*", "experts*", "f51*", "tools*", "adapters*"]
