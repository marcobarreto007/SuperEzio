[pytest]
minversion = 8.0
addopts = -v --tb=short --maxfail=5
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    smoke: fast runtime and pipeline liveness tests
    contract: public API surface and data invariant tests
    integration: tests requiring live servers (CEO on :8082, API on :8002)
    slow: tests that take more than 5 seconds
