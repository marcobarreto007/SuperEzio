[pytest]
minversion = 8.0
# Coverage is deliberately NOT in addopts: pytest-cov overwrites the live
# .coverage database on every run (even --collect-only), destroying the
# evidence of the last full measured run. Run coverage explicitly and save
# the report immediately:
#   python -m pytest tests/ -q --cov=src --cov-report=term-missing > runtime/checkpoints/coverage-report-<date>.txt
addopts = -v --tb=short --maxfail=5 --strict-markers -m "not live_model"
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    smoke: fast runtime and pipeline liveness tests
    contract: public API surface and data invariant tests
    integration: tests requiring live servers (CEO on :8080, API on :8002)
    slow: tests that take more than 5 seconds
    security: SAST and vulnerability scanning tests
    property: Hypothesis property-based tests
    stress: long-running stress/load tests for runtime stability
    live_model: contract tests on live model output (non-deterministic; run explicitly with -m live_model)
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:Type google\._upb\._message\.MessageMapContainer uses PyType_Spec.*:DeprecationWarning
    ignore:Type google\._upb\._message\.ScalarMapContainer uses PyType_Spec.*:DeprecationWarning
    ignore:.*model_validator.*mode.*after.*classmethod.*:pydantic.warnings.PydanticDeprecatedSince212
    ignore:.*model_fields.*attribute.*instance.*:pydantic.warnings.PydanticDeprecatedSince211
    ignore:Inheritance class ClientSession from ClientSession is discouraged:DeprecationWarning:openbb_core\.
