services:
  bob-ceo:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: superezio-bob
    command:
      - "--model"
      - "/models/Qwen3.8-27B-Q4_K_M.gguf"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "-ngl"
      - "all"
      - "-sm"
      - "layer"
      - "-ts"
      - "12,8"
      - "-c"
      - "8192"
      - "-np"
      - "1"
      - "-fa"
      - "on"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--reasoning"
      - "off"
      - "--mlock"
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superezio-api
    command: ["python", "-m", "agent_server.main"]
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app/src
      - SUPEREZIO_HOST=0.0.0.0
      - SUPEREZIO_RUNTIME_PROFILE=docker
      - SUPEREZIO_PRIMARY_BASE_URL=http://bob-ceo:8080/v1
      - SUPEREZIO_AGENT_BASE_URL=http://bob-ceo:8080/v1
      - SUPEREZIO_DEEPSEEK_BASE_URL=https://api.deepseek.com
      - "SUPEREZIO_DEEPSEEK_API_KEY=${SUPEREZIO_DEEPSEEK_API_KEY:?SUPEREZIO_DEEPSEEK_API_KEY is required}"
      - SUPEREZIO_CEO_BASE_URL=http://bob-ceo:8080/v1
      - SUPEREZIO_PRIMARY_MODEL=Qwen3.8-27B-Q4_K_M
      - SUPEREZIO_AGENT_MODEL=Qwen3.8-27B-Q4_K_M
      - SUPEREZIO_DEEPSEEK_MODEL=deepseek-v4-pro
      - F51_TRADING_EXECUTION_FREEZE=true
      - SUPEREZIO_LIVE_TRADING_DISABLED=1
      - SUPEREZIO_DAYTRADE_PAPER_ONLY=1
      - SUPEREZIO_ENABLE_PAPER_ORDER_SUBMIT=false
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./journal:/app/journal
    depends_on:
      bob-ceo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
