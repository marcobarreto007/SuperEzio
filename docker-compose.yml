version: "3.8"

services:
  bob-ceo:
    image: ghcr.io/ggerganov/llama.cpp:full-cuda
    container_name: superezio-bob
    command:
      - "--model"
      - "/models/Huihui-Qwen3-Next-80B-A3B-Instruct-abliterated.IQ4_XS.gguf"
      - "--port"
      - "8082"
      - "--host"
      - "0.0.0.0"
      - "-ngl"
      - "14"
      - "-c"
      - "131072"
      - "-np"
      - "2"
      - "-fa"
      - "on"
      - "-ctk"
      - "q8_0"
      - "-ctv"
      - "q8_0"
      - "--n-cpu-moe"
      - "31"
      - "-cram"
      - "8192"
      - "--reasoning"
      - "off"
      - "--mlock"
    ports:
      - "8082:8082"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superezio-api
    command: ["python", "-m", "agent_server.main"]
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app/src
      - SUPEREZIO_PRIMARY_BASE_URL=http://bob-ceo:8082/v1
      - SUPEREZIO_AGENT_BASE_URL=http://bob-ceo:8082/v1
      - SUPEREZIO_CEO_BASE_URL=http://bob-ceo:8082/v1
      - F51_TRADING_EXECUTION_FREEZE=true
      - SUPEREZIO_ENABLE_PAPER_ORDER_SUBMIT=false
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./journal:/app/journal
    depends_on:
      bob-ceo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  learner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superezio-learner
    command: ["python", "-m", "core.trading.autonomous_learner"]
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superezio-watchdog
    command: ["python", "scripts/bob_watchdog.py"]
    environment:
      - PYTHONPATH=/app/src
      - BOB_WATCHDOG_INTERVAL_SEC=30
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - bob-ceo
    restart: unless-stopped
