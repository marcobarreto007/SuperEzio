name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e .
          .venv\Scripts\pip install pytest pytest-cov ruff mypy
      - name: Lint with Ruff
        run: .venv\Scripts\ruff check src tests
      - name: Format check (Ruff)
        run: .venv\Scripts\ruff format src tests --check
      - name: Type check (mypy)
        run: .venv\Scripts\mypy src/ --ignore-missing-imports --check-untyped-defs --follow-imports=skip
        continue-on-error: true
      - name: Run tests with coverage
        run: .venv\Scripts\python -m pytest tests/ -q --cov=src --cov-report=term
