# ===========================================================================
# QLoRA SFT Fine-tuning Config — GLM-4.7-Flash (30B-A3B MoE)
# ===========================================================================
# Usage:
#   python scripts/finetune_glm_sft.py --config scripts/finetune_glm_config.yaml
#   (Or pass params directly via CLI — they override YAML values)
# ===========================================================================

# ── Model ────────────────────────────────────────────────────────────────
model:
  # HuggingFace model ID — zai-org/GLM-4.7-Flash is the official release.
  # Alternative: local path to downloaded model files.
  id: "zai-org/GLM-4.7-Flash"

  # Architecture (for reference, not configurable)
  architecture: "Glm4MoeLiteForCausalLM"
  total_params: "30B"
  active_params_per_token: "~3B"
  num_experts: 64
  shared_experts: 1
  context_window: 202752

# ── Dataset ──────────────────────────────────────────────────────────────
dataset:
  path: "F51_Datasets/sft_output/f51_final_sft.jsonl"
  format: "chat_messages"  # messages array with system/user/assistant
  total_entries: 410918
  estimated_tokens: "~223M"

  # Category distribution (informational)
  categories:
    transaction_risk: 377000
    phishing_detection: 17164
    social_fraud: 11900
    financial_qa: 1385
    sentiment_analysis: 1173
    finance_knowledge: 600
    agent_management: 600
    persona: 600
    document_fraud: 166
    other: 330

  # Difficulty distribution
  difficulty:
    easy: 371031
    medium: 30331
    hard: 7756
    unknown: 1800

  # Training params
  max_length: 4096
  streaming: true
  shuffle_buffer: 10000

# ── QLoRA Configuration ──────────────────────────────────────────────────
qlora:
  # 4-bit NormalFloat4 is the recommended quantization type
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

  # LoRA adapter
  r: 64             # Rank — higher = more capacity, more VRAM
  alpha: 128        # Scaling factor (alpha/r = effective strength)
  dropout: 0.05     # Regularization
  bias: "none"

  # Target modules
  # Attention projections (MLA): q_a_proj, q_b_proj, kv_a_proj_with_mqa,
  #                             kv_b_proj, o_proj
  # Shared expert FFN: shared_expert.gate_proj, shared_expert.up_proj,
  #                    shared_expert.down_proj
  # NOTE: Use "shared_expert.<proj>" suffix to avoid targeting the 64
  #       routed experts (which share the same leaf names).
  # Recommended: attention + shared expert only (NOT routed experts)
  # This gives ~80-120M trainable params depending on rank.
  target_modules:
    - q_a_proj
    - q_b_proj
    - kv_a_proj_with_mqa
    - kv_b_proj
    - o_proj
    - shared_expert.gate_proj
    - shared_expert.up_proj
    - shared_expert.down_proj

  # Set to true to also target the 64 routed experts (huge adapter)
  include_routed_experts: false

# ── Training ─────────────────────────────────────────────────────────────
training:
  num_epochs: 2
  per_device_batch_size: 2
  gradient_accumulation_steps: 8

  # Effective batch size = per_device_batch * grad_accum * num_gpus
  # e.g. 2 * 8 * 2 = 32 with 2 GPUs
  effective_batch_size: 16   # with 1 GPU; 32 with 2 GPUs

  learning_rate: 2.0e-4
  lr_scheduler: "cosine"     # cosine, linear, constant, cosine_with_restarts
  warmup_steps: 100
  max_grad_norm: 1.0

  # Mixed precision
  bf16: true

  # Checkpointing
  save_steps: 500
  save_total_limit: 3
  eval_steps: 500
  logging_steps: 10

  # Gradient checkpointing (already enabled in script)
  gradient_checkpointing: true

  # Optimizer defaults to AdamW 8-bit via bitsandbytes (auto by Trainer)
  # For large-scale training, consider:
  #   optim: "adamw_bnb_8bit"
  #   optim: "paged_adamw_8bit"

# ── Multi-GPU (Accelerate) ──────────────────────────────────────────────
# For multi-GPU, use:
#   accelerate launch --num_processes 2 scripts/finetune_glm_sft.py ...
#
# Or with DeepSpeed ZeRO-2:
#   accelerate launch --num_processes 2 \
#     --deepspeed_config_file scripts/ds_config_zero2.json \
#     scripts/finetune_glm_sft.py ...
#
# DeepSpeed ZeRO-2 config (create scripts/ds_config_zero2.json):
# {
#   "zero_optimization": {
#     "stage": 2,
#     "offload_optimizer": {"device": "cpu"},
#     "allgather_partitions": true,
#     "allgather_bucket_size": 2e8,
#     "reduce_scatter": true,
#     "reduce_bucket_size": 2e8,
#     "overlap_comm": true
#   },
#   "bf16": {"enabled": true},
#   "train_batch_size": "auto",
#   "train_micro_batch_size_per_gpu": "auto",
#   "gradient_accumulation_steps": "auto",
#   "wall_clock_breakdown": false
# }

# ── Hardware Estimations ─────────────────────────────────────────────────
hardware:
  # RTX 4090 24GB (single GPU):
  #   - batch_size=2, max_length=4096, lora_r=64: fits comfortably (~18-20GB)
  #   - batch_size=4, max_length=4096, lora_r=64: may OOM, use gradient_accumulation
  #   - Recommended: batch_size=2, gradient_accumulation=8 → effective batch=16
  #
  # A100 40GB (single GPU):
  #   - batch_size=4, max_length=8192, lora_r=64: fits (~32-35GB)
  #   - batch_size=2, max_length=16384, lora_r=128: fits (~35-38GB)
  #   - Recommended: batch_size=4, gradient_accumulation=4 → effective batch=16
  #
  # A100 80GB (single GPU):
  #   - batch_size=8, max_length=8192, lora_r=128: fits (~55-65GB)
  #   - Recommended: batch_size=4, gradient_accumulation=2 → effective batch=16

  # Memory breakdown (approximately, with 4-bit NF4):
  #   Model weights (4-bit):    ~16-18 GB
  #   LoRA adapters:            ~0.3-0.5 GB
  #   Optimizer states (32-bit): ~1.5-2 GB
  #   Activations (seq_len=4096): ~4-8 GB (varies with batch size)
  #   Total:                    ~22-28 GB on RTX 4090

# ── Training Time Estimates ──────────────────────────────────────────────
time_estimates:
  # RTX 4090 24GB:
  #   410K samples, 2 epochs, effective_batch=16:
  #     Steps/epoch: ~25600
  #     Steps total: ~51200
  #     ~2-3 tokens/sec/sample (estimated for MoE)
  #     ~40-60 hours total
  #
  # A100 40GB:
  #   410K samples, 2 epochs, effective_batch=16:
  #     ~20-30 hours total
  #
  # Quick test (5000 samples, 1 epoch):
  #   ~20-30 min on any GPU

# ── Evaluation ───────────────────────────────────────────────────────────
evaluation:
  # Test prompts are embedded in the script (TEST_PROMPTS constant)
  # Add custom prompts here for CLI override
  test_prompts: []

# ── Export ───────────────────────────────────────────────────────────────
export:
  # Merge LoRA into base model (needs ~64GB CPU RAM for 30B model)
  merge_after_training: false

  # GGUF export (requires manual conversion after merge)
  # python scripts/convert_hf_to_gguf.py output/glm-sft/merged
  # ./quantize output/glm-sft/merged/ggml-model-f16.gguf Q4_K_M

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  backend: "none"  # none, wandb, mlflow, tensorboard
  wandb:
    project: "superezio-glm-sft"
    entity: null
    tags: ["qlora", "sft", "glm-4.7-flash", "fraud-detection"]

