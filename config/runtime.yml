# SuperEzio Runtime Configuration v4.2.0
# Fonte canonica de configuracao de runtime.
# ATUALIZADO: 2026-09-10 - DeepSeek em TODOS os papeis (Bob, orquestrador,
# experts, judge e auditor) via API oficial. GLM-5.3 fica opcional e
# religavel por SUPEREZIO_PRIMARY_MODEL / SUPEREZIO_AGENT_MODEL.

project_name: SuperEzio
version: 4.2.0
default_country: Canada
default_currency: CAD

# ---------------------------------------------------------------------------
# Server bindings
# ---------------------------------------------------------------------------
server:
  host: 127.0.0.1
  port: 8002
  entrypoint: python -m agent_server.main
  pythonpath: src
  venv: .venv

# ---------------------------------------------------------------------------
# Modelos (DeepSeek em todos os papeis; GLM-5.3 opcional/religavel)
# ---------------------------------------------------------------------------
models:
  agent:
    name: DeepSeek V4 Flash (CEO mouth)
    provider_name: agent
    model_id: deepseek-v4-flash
    base_url: https://api.deepseek.com
    backend: openai_compatible
    role: agent
    is_local: false
    api_key_env: SUPEREZIO_DEEPSEEK_API_KEY
    api_key_required: true
    temperature: 0.3
    max_tokens: 1800
    timeout_s: 180

  orchestrator:
    name: DeepSeek V4 Flash (orchestrator)
    provider_name: local_orchestrator
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    backend: openai_compatible
    role: orchestrator
    is_local: false
    api_key_env: SUPEREZIO_DEEPSEEK_API_KEY
    api_key_required: true
    max_tokens: 1800
    timeout_s: 180

  experts:
    name: DeepSeek V4 Flash financial experts
    provider_name: deepseek
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    backend: openai_compatible
    role: worker
    is_local: false
    api_key_env: SUPEREZIO_DEEPSEEK_API_KEY
    api_key_required: true
    allow_fallback: false
    max_tokens: 1800
    timeout_s: 60
    roles:
      - fundamental
      - technical
      - risk
      - macro
      - quant
      - sentiment

  daytrade_judge:
    name: DeepSeek V4 Flash daytrade judge
    provider_name: daytrade_judge
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    backend: openai_compatible
    role: judge
    is_local: false
    api_key_env: SUPEREZIO_DEEPSEEK_API_KEY
    api_key_required: true
    allow_fallback: false
    max_tokens: 1800
    timeout_s: 60

  daytrade_auditor:
    name: DeepSeek V4 Flash daytrade auditor
    provider_name: daytrade_auditor
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    backend: openai_compatible
    role: auditor
    is_local: false
    api_key_env: SUPEREZIO_DEEPSEEK_API_KEY
    api_key_required: true
    allow_fallback: false
    max_tokens: 1800
    timeout_s: 60

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  max_fallbacks: 2
  timeout_s: 600

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
health:
  api_public:
    url: http://127.0.0.1:8002/health
    method: GET
    expected: status=ok
  api_details:
    url: http://127.0.0.1:8002/health/details
    method: GET
    expected: status=ok

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  memory_dir: data/memory
  vectors_dir: data/vectors
  logs_dir: runtime/logs
  checkpoints_dir: .f51/checkpoints
  runtime_checkpoints_dir: runtime/checkpoints
  models_dir: models

# ---------------------------------------------------------------------------
# Launch sequence (ordem canonica)
# ---------------------------------------------------------------------------
launch:
  step_1:
    description: SuperEzio API e interface, com inteligencia via APIs externas
    command: python -m agent_server.main
    wait_for: http://127.0.0.1:8002/health
    timeout_attempts: 40
    window_title: SuperEzio API

# ---------------------------------------------------------------------------
# Test commands
# ---------------------------------------------------------------------------
tests:
  lint: python -m ruff check src tests
  format_check: python -m ruff format --check src tests
  unit_and_contract: python -m pytest tests/ -q
  contract_only: python -m pytest tests/contracts/ -q
