# SuperEzio Runtime Configuration v4.2.0
# Fonte canonica de configuracao de runtime.
# ATUALIZADO: 2026-08-18 - ZERO-CLOUD: todos os papeis LLM no servidor local
# compartilhado (perfil cc) em :8080. Sem providers de nuvem. Se :8080 cair,
# o sistema trava em MAN_AT_WORK.

project_name: SuperEzio
version: 4.2.0
default_country: Canada
default_currency: CAD

# ---------------------------------------------------------------------------
# Server bindings
# ---------------------------------------------------------------------------
server:
  host: 127.0.0.1
  port: 8002
  entrypoint: python -m agent_server.main
  pythonpath: src
  venv: .venv

# ---------------------------------------------------------------------------
# Modelos (ZERO-CLOUD, validado 2026-08-16)
# ---------------------------------------------------------------------------
models:
  agent:
    name: Qwen3.8-27B Local (shared cc)
    provider_name: agent
    model_id: Qwen3.8-27B-Q4_K_M
    path: "C:\\Users\\marco\\models\\qwen3.8-27b\\Qwen3.8-27B-Q4_K_M.gguf"
    quantization: Q4_K_M
    server_url: http://127.0.0.1:8080/v1
    backend: openai_compatible
    role: agent
    is_local: true
    temperature: 0.3
    max_tokens: 8192
    timeout_s: 300
    script: scripts/serve_agent_llamacpp.ps1
    preferred_llama_server: "C:\\Users\\marco\\tools\\llama.cpp\\llama-server.exe"
    # Perfil 2026-08-18: -ngl all -sm layer -ts 12,8, cache q8_0, contexto 8192
    # (RTX 3060 12GB + RTX 2070 8GB). Sem IQ2. MTP desligado (OOM com Q4).
    context_length: 8192
    gpu_layers: all
    tensor_split: "12,8"
    slots: 1
    thinking: disabled
    model_type: local_gguf
    base_model: Qwen3.8-27B
    # Servidor compartilhado com o Claude Code (perfil cc): um servidor, um
    # slot. NAO subir segunda instancia (VRAM nao aguenta dois servidores).

  orchestrator:
    name: Qwen3.8-27B Local (shared cc)
    provider_name: local_orchestrator
    path: http://127.0.0.1:8080/v1
    model_id: Qwen3.8-27B-Q4_K_M
    backend: openai_compatible
    role: orchestrator
    is_local: true

  experts:
    name: Local experts (shared cc)
    provider_name: deepseek
    base_url: http://127.0.0.1:8080/v1
    model_id: Qwen3.8-27B-Q4_K_M
    backend: openai_compatible
    role: worker
    is_local: true
    roles:
      - fundamental
      - technical
      - risk
      - macro
      - quant
      - sentiment

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  max_fallbacks: 2
  timeout_s: 600

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
health:
  agent:
    url: http://127.0.0.1:8080/health
    method: GET
    expected: ok
  api_public:
    url: http://127.0.0.1:8002/health
    method: GET
    expected: status=ok
  api_details:
    url: http://127.0.0.1:8002/health/details
    method: GET
    expected: status=ok

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  memory_dir: data/memory
  vectors_dir: data/vectors
  logs_dir: runtime/logs
  checkpoints_dir: .f51/checkpoints
  runtime_checkpoints_dir: runtime/checkpoints
  models_dir: models

# ---------------------------------------------------------------------------
# Launch sequence (ordem canonica)
# ---------------------------------------------------------------------------
launch:
  step_1:
    description: CEO llama-server (perfil cc compartilhado — :8080)
    # Preferencia: subir via run-cc.ps1 do operador (perfil validado).
    # Fallback: serve_agent_llamacpp.ps1 sobe o mesmo modelo na :8080.
    command: powershell -ExecutionPolicy Bypass -File scripts/serve_agent_llamacpp.ps1 -Port 8080
    wait_for: http://127.0.0.1:8080/health
    timeout_attempts: 50
    window_title: SuperEzio CEO

  step_2:
    description: API agent_server
    command: python -m agent_server.main
    wait_for: http://127.0.0.1:8002/health
    timeout_attempts: 40
    window_title: SuperEzio API

# ---------------------------------------------------------------------------
# Test commands
# ---------------------------------------------------------------------------
tests:
  lint: python -m ruff check src tests
  format_check: python -m ruff format --check src tests
  unit_and_contract: python -m pytest tests/ -q
  contract_only: python -m pytest tests/contracts/ -q
