# SuperEzio Runtime Configuration v4.0.0
# Fonte canonica de configuracao de runtime.
# ATUALIZADO: 2026-05-20 - CEO merged GGUF, API local, orchestrator local, experts cloud.

project_name: SuperEzio
version: 4.0.0
default_country: Canada
default_currency: CAD

# ---------------------------------------------------------------------------
# Server bindings
# ---------------------------------------------------------------------------
server:
  host: 127.0.0.1
  port: 8002
  entrypoint: python -m agent_server.main
  pythonpath: src
  venv: .venv

# ---------------------------------------------------------------------------
# Modelos (runtime real validado 2026-06-29)
# ---------------------------------------------------------------------------
models:
  agent:
    name: Bob Core Local
    provider_name: agent
    model_id: bob-core-local
    path: "C:\\llama.cpp\\models\\bob-core-local.gguf"
    lora_path: "C:\\llama.cpp\\models\\bob-lora-best.gguf"
    quantization: Q4_K_M
    server_url: http://127.0.0.1:8082/v1
    backend: openai_compatible
    role: agent
    is_local: true
    temperature: 0.3
    max_tokens: 8192
    timeout_s: 300
    script: scripts/serve_agent_llamacpp.ps1
    preferred_llama_server: "C:\\llama.cpp\\build\\bin\\llama-server.exe"
    fallback_llama_server: llama.cpp\bin\llama-server.exe
    speculative_decoding: disabled
    # UNVERIFIED (2026-07-19): this contradicts .f51/ENTRYPOINT_MAP.md, which
    # documents context_length=65536 and gpu_layers=49 for a differently
    # named artifact (Bob Core-q4_k.gguf, no LoRA) as "runtime real validado
    # 2026-06-29". Neither this file's model (bob-core-local.gguf +
    # bob-lora-best.gguf) nor the ENTRYPOINT_MAP.md model exist on this
    # machine (C:\llama.cpp\models\ is absent) — see .f51/RISK_REGISTER.md
    # INV-R15. Do not trust either number until re-measured against a live
    # llama-server /health or /v1/models response.
    context_length: 4096
    gpu_layers: 35
    slots: 1
    thinking: disabled
    model_type: local_gguf_lora
    base_model: Bob Core

  orchestrator:
    name: Bob Core Local
    provider_name: local_orchestrator
    path: http://127.0.0.1:8082/v1
    model_id: bob-core-local
    backend: openai_compatible
    role: orchestrator
    is_local: true

  experts:
    name: DeepSeek V4 Pro (Experts)
    provider_name: deepseek
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-pro
    backend: openai_compatible
    role: worker
    is_local: false
    roles:
      - fundamental
      - technical
      - risk
      - macro
      - quant
      - sentiment

  fallback:
    grok:
      name: Grok 4.3 (Fallback)
      provider_name: grok
      base_url: https://api.x.ai/v1
      model: grok-4.3
      role: cloud_primary
      is_local: false

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  max_fallbacks: 2
  timeout_s: 600

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
health:
  agent:
    url: http://127.0.0.1:8082/health
    method: GET
    expected: ok
  api_public:
    url: http://127.0.0.1:8002/health
    method: GET
    expected: status=ok
  api_details:
    url: http://127.0.0.1:8002/health/details
    method: GET
    expected: status=ok

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  memory_dir: data/memory
  vectors_dir: data/vectors
  logs_dir: runtime/logs
  checkpoints_dir: .f51/checkpoints
  runtime_checkpoints_dir: runtime/checkpoints
  models_dir: models

# ---------------------------------------------------------------------------
# Launch sequence (ordem canÃƒÂ´nica)
# ---------------------------------------------------------------------------
launch:
  step_1:
    description: CEO llama-server
    command: powershell -ExecutionPolicy Bypass -File scripts/serve_agent_llamacpp.ps1 -Port 8082
    wait_for: http://127.0.0.1:8082/health
    timeout_attempts: 50
    window_title: SuperEzio CEO

  step_2:
    description: API agent_server
    command: python -m agent_server.main
    wait_for: http://127.0.0.1:8002/health
    timeout_attempts: 40
    window_title: SuperEzio API

# ---------------------------------------------------------------------------
# Test commands
# ---------------------------------------------------------------------------
tests:
  lint: python -m ruff check src tests
  format_check: python -m ruff format --check src tests
  unit_and_contract: python -m pytest tests/ -q
  contract_only: python -m pytest tests/contracts/ -q
