# SuperEzio Runtime Configuration v4.0.0
# Fonte canonica de configuracao de runtime.
# ATUALIZADO: 2026-05-20 - CEO merged GGUF, API local, orchestrator local, experts cloud.

project_name: SuperEzio
version: 4.0.0
default_country: Canada
default_currency: CAD

# ---------------------------------------------------------------------------
# Server bindings
# ---------------------------------------------------------------------------
server:
  host: 127.0.0.1
  port: 8002
  entrypoint: python -m agent_server.main
  pythonpath: src
  venv: .venv

# ---------------------------------------------------------------------------
# Modelos (runtime real validado 2026-05-21)
# ---------------------------------------------------------------------------
models:
  agent:
    name: Qwen3-Next-80B Abliterated (Nitro MoE CEO)
    provider_name: agent
    model_id: qwen3-next-80b-abliterated
    path: models/Huihui-Qwen3-Next-80B-A3B-Instruct-abliterated.IQ4_XS.gguf
    quantization: IQ4_XS (4.25 BPW)
    server_url: http://127.0.0.1:8082/v1
    backend: openai_compatible
    role: agent
    is_local: true
    temperature: 0.3
    max_tokens: 8192
    timeout_s: 300
    script: scripts/serve_agent_llamacpp.ps1
    preferred_llama_server: C:\llama.cpp\build-cuda\bin\llama-server.exe
    fallback_llama_server: llama.cpp\bin\llama-server.exe
    speculative_decoding: disabled
    context_length: 131072
    gpu_layers: 999
    cpu_moe: true
    n_cpu_moe: 31
    cache_ram_mib: 8192
    slots: 2
    thinking: disabled
    f51_moe_cache: true
    f51_moe_sched_skip: true
    f51_moe_cache_capacity: 16
    nitro_layer1_persistence_cache: 16
    nitro_layer2_async_streams: true
    nitro_layer3_router_lookahead: true
    nitro_layer4_kv_cache_tiering: true
    model_type: MoE
    total_experts: 512
    active_experts_per_token: 10
    expert_size_mb: 59
    base_model: Qwen/Qwen3-Next-80B-A3B
    ablation: Arbitrary-Rank Ablation (Huihui-AI)

  orchestrator:
    name: Qwen3-Next-80B Abliterated (same local model)
    provider_name: local_orchestrator
    path: http://127.0.0.1:8082/v1
    model_id: qwen3-next-80b-abliterated
    backend: openai_compatible
    role: orchestrator
    is_local: true

  experts:
    name: DeepSeek V4 Pro (Experts)
    provider_name: deepseek
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-pro
    backend: openai_compatible
    role: worker
    is_local: false
    roles:
      - fundamental
      - technical
      - risk
      - macro
      - quant
      - sentiment

  fallback:
    grok:
      name: Grok 4.3 (Fallback)
      provider_name: grok
      base_url: https://api.x.ai/v1
      model: grok-4.3
      role: cloud_primary
      is_local: false

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  max_fallbacks: 2
  timeout_s: 180

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
health:
  agent:
    url: http://127.0.0.1:8082/health
    method: GET
    expected: ok
  api_public:
    url: http://127.0.0.1:8002/health
    method: GET
    expected: status=ok
  api_details:
    url: http://127.0.0.1:8002/health/details
    method: GET
    expected: status=ok

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  memory_dir: data/memory
  vectors_dir: data/vectors
  logs_dir: runtime/logs
  checkpoints_dir: .f51/checkpoints
  runtime_checkpoints_dir: runtime/checkpoints
  models_dir: models

# ---------------------------------------------------------------------------
# Launch sequence (ordem canÃƒÂ´nica)
# ---------------------------------------------------------------------------
launch:
  step_1:
    description: CEO llama-server
    command: powershell -ExecutionPolicy Bypass -File scripts/serve_agent_llamacpp.ps1 -Port 8082
    wait_for: http://127.0.0.1:8082/health
    timeout_attempts: 50
    window_title: SuperEzio CEO

  step_2:
    description: API agent_server
    command: python -m agent_server.main
    wait_for: http://127.0.0.1:8002/health
    timeout_attempts: 40
    window_title: SuperEzio API

# ---------------------------------------------------------------------------
# Test commands
# ---------------------------------------------------------------------------
tests:
  lint: python -m ruff check src tests
  format_check: python -m ruff format --check src tests
  unit_and_contract: python -m pytest tests/ -q
  contract_only: python -m pytest tests/contracts/ -q
