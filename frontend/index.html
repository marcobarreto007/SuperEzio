<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperEzio — AI Financial Copilot</title>
  <meta name="description" content="SuperEzio AI copilot: F51 verdict engine, evidence-based financial analysis.">
  <meta name="theme-color" content="#111510">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f7f9f4;
      --surface: #fff;
      --line: #e2e7dd;
      --ink: #141a13;
      --muted: #5d6b5a;
      --dark: #111510;
      --dark-soft: #1c241c;
      --green: #2f7a4e;
      --green-bg: #e8f3e4;
      --amber: #d58a55;
      --amber-bg: #fef3e8;
      --red: #c95757;
      --red-bg: #fdeaea;
      --blue: #3b6fa0;
      --blue-bg: #e6f0f8;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 2px 16px rgba(17, 21, 16, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100dvh;
      overflow: hidden;
    }

    .app-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 249, 244, 0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--dark);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot--on {
      background: #6aa86c;
    }

    .status-dot--off {
      background: var(--red);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.35
      }
    }

    .spacer {
      flex: 1;
    }

    .ticker-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ticker-wrap input,
    .ticker-wrap select {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      padding: 7px 10px;
      font: 600 13px "JetBrains Mono", monospace;
      min-height: 34px;
    }

    .ticker-wrap input {
      width: 110px;
      text-transform: uppercase;
    }

    .ticker-wrap select {
      width: 60px;
    }

    .ticker-wrap input:focus,
    .ticker-wrap select:focus {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
      border-color: var(--blue);
    }

    /* ── CHAT AREA ── */
    .chat {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* ── LIVE PANEL ── */
    .live-panel {
      border-left: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .live-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .live-hdr strong {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .live-status {
      margin-left: auto;
      font: 700 10px "JetBrains Mono", monospace;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .live-status--on {
      color: #2f7a4e;
      border-color: #86c399;
      background: #eef9f0;
    }

    .live-status--off {
      color: #8a6a41;
      border-color: #e4d4bf;
      background: #fff7ec;
    }

    .live-status--err {
      color: var(--red);
      border-color: #e3b8b8;
      background: #fdeeee;
    }

    .live-wrap {
      padding: 10px 12px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .live-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .live-metric {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px;
      background: var(--bg);
    }

    .live-metric span {
      display: block;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .live-metric strong {
      font: 700 12px "JetBrains Mono", monospace;
    }

    .live-canvas-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fbfcfa;
      padding: 6px;
    }

    .live-canvas-wrap canvas {
      width: 100%;
      height: 280px;
      display: block;
    }

    .live-note {
      font-size: 11px;
      color: var(--muted);
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .msg-user {
      align-self: flex-end;
    }

    .msg-ceo {
      align-self: flex-start;
    }

    .msg-bubble {
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-user .msg-bubble {
      background: var(--dark);
      color: #f0f4ec;
      border-bottom-right-radius: 4px;
    }

    .msg-ceo .msg-bubble {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    .msg-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .msg-meta span {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .msg-ceo .msg-meta {
      flex-direction: row;
    }

    .msg-user .msg-meta {
      justify-content: flex-end;
    }

    /* ── INLINE CARDS (inside CEO bubble) ── */
    .card {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--bg);
      overflow: hidden;
    }

    .card-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      transition: background 0.15s;
    }

    .card-hdr:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    .card-hdr .card-icon {
      width: 16px;
      height: 16px;
    }

    .card-badge {
      margin-left: auto;
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-badge--pass {
      background: var(--green);
      color: #fff;
    }

    .card-badge--fail {
      background: var(--red);
      color: #fff;
    }

    .card-badge--warn {
      background: var(--amber);
      color: #fff;
    }

    .card-badge--info {
      background: var(--blue);
      color: #fff;
    }

    .card-badge--neutral {
      background: var(--line);
      color: var(--ink);
    }

    .card-body {
      padding: 0 12px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }

    .card.open .card-body {
      max-height: 800px;
      padding: 8px 12px 12px;
      overflow-y: auto;
    }

    /* ── F51 CARD ── */
    .f51-ring-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .f51-ring {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .f51-ring-pct {
      font-family: "JetBrains Mono", monospace;
      font-size: 16px;
      font-weight: 700;
    }

    .f51-factors {
      display: grid;
      gap: 4px;
      flex: 1;
    }

    .f51-factor {
      display: grid;
      grid-template-columns: 72px 1fr 32px;
      align-items: center;
      gap: 6px;
      font-size: 10px;
    }

    .f51-factor span {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .f51-factor-bar {
      height: 5px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }

    .f51-factor-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }

    .f51-factor strong {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      text-align: right;
    }

    .f51-hub {
      display: grid;
      grid-template-columns: 72px 1fr 32px;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 10px;
    }

    .f51-hub span {
      color: var(--muted);
      font-weight: 700;
    }

    .f51-hub-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }

    .f51-hub-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }

    .f51-hub strong {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      text-align: right;
    }

    /* ── DATA QUALITY ── */
    .dq-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .dq-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .dq-tile--ok {
      border-color: var(--green);
      background: var(--green-bg);
    }

    .dq-tile--partial {
      border-color: var(--amber);
      background: var(--amber-bg);
    }

    .dq-tile--error {
      border-color: var(--red);
      background: var(--red-bg);
    }

    .dq-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--line);
    }

    .dq-dot--ok {
      background: #6aa86c;
    }

    .dq-dot--partial {
      background: var(--amber);
    }

    .dq-dot--error {
      background: var(--red);
    }

    /* ── PENNYLAB ── */
    .pl-scores {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .pl-score {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    .pl-score span {
      display: block;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pl-score strong {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
      display: block;
    }

    .pl-score-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin-top: 4px;
      overflow: hidden;
    }

    .pl-score-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.35s;
    }

    /* ── EXPERT GRID ── */
    .exp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
    }

    .exp-tile {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 600;
    }

    .exp-tile--ok {
      border-color: var(--green);
    }

    .exp-tile--fail {
      border-color: var(--red);
    }

    .exp-tile--running {
      border-color: var(--amber);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .exp-tile--skip {
      opacity: 0.4;
    }

    .exp-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
    }

    .exp-dot--ok {
      background: #6aa86c;
    }

    .exp-dot--fail {
      background: var(--red);
    }

    .exp-dot--running {
      background: var(--amber);
    }

    /* ── CRISIS ── */
    .crisis-regime-badge {
      display: inline-flex;
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .crisis-bar {
      display: grid;
      grid-template-columns: 72px 1fr 32px;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 10px;
    }

    .crisis-bar span {
      color: var(--muted);
      font-weight: 700;
    }

    .crisis-bar-track {
      height: 7px;
      border-radius: 4px;
      background: var(--line);
      overflow: hidden;
    }

    .crisis-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #6aa86c, var(--amber), var(--red));
      transition: width 0.4s;
    }

    .crisis-bar strong {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      text-align: right;
    }

    .crisis-alerts {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .crisis-alert {
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }

    .crisis-models {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
    }

    .crisis-model {
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
    }

    .crisis-model strong {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--ink);
    }

    /* ── CHART ── */
    .chart-card canvas {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-sm);
      background: #fbfcfa;
      border: 1px solid var(--line);
    }

    /* ── PIPELINE PROGRESS ── */
    .pipeline-bar {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 6px;
      padding: 0 4px;
    }

    .pipeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 40px;
    }

    .pipeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--surface);
      transition: all 0.3s;
    }

    .pipeline-dot--done {
      border-color: var(--green);
      background: #6aa86c;
    }

    .pipeline-dot--running {
      border-color: var(--amber);
      background: var(--amber);
      animation: pulse-dot 1.5s infinite;
    }

    .pipeline-dot--error {
      border-color: var(--red);
      background: var(--red);
    }

    .pipeline-line {
      flex: 1;
      height: 2px;
      min-width: 6px;
      background: var(--line);
      transition: background 0.3s;
    }

    .pipeline-line--done {
      background: #6aa86c;
    }

    .pipeline-line--active {
      background: var(--amber);
    }

    .pipeline-label {
      font-size: 8px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── BOTTOM BAR ── */
    .bottombar {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--surface);
      align-items: flex-end;
    }

    .bottombar textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 14px;
      font: 14px "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }

    .bottombar textarea:focus {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
      border-color: var(--blue);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font: 700 13px "Manrope", system-ui, sans-serif;
      cursor: pointer;
    }

    .btn--primary {
      background: var(--dark);
      color: #fff;
    }

    .btn--primary:hover {
      background: #000;
    }

    .btn--primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn--icon {
      width: 38px;
      min-height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius-sm);
    }

    .btn--sm {
      min-height: 30px;
      padding: 5px 10px;
      font-size: 11px;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: var(--radius-sm);
    }

    /* ── PORTFOLIO DRAWER ── */
    .portfolio-drawer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      font-size: 11px;
    }

    .portfolio-drawer label {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-weight: 700;
    }

    .portfolio-drawer input,
    .portfolio-drawer select {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      background: var(--surface);
      color: var(--ink);
      font: 12px "JetBrains Mono", monospace;
    }

    /* ── THINKING INDICATOR ── */
    .thinking {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .thinking span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .thinking span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .app-main {
        grid-template-columns: 1fr;
      }

      .live-panel {
        border-left: none;
        border-top: 1px solid var(--line);
        max-height: 46vh;
      }

      .topbar {
        flex-wrap: wrap;
        gap: 6px;
      }

      .chat {
        padding: 10px;
      }

      .msg {
        max-width: 100%;
      }

      .dq-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .pl-scores {
        grid-template-columns: repeat(3, 1fr);
      }

      .exp-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .crisis-models {
        grid-template-columns: repeat(2, 1fr);
      }

      .portfolio-drawer {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- ── TOP BAR ── -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">SE</span>
      SuperEzio
    </div>
    <span class="status-dot status-dot--off" id="sys-dot" title="Checking..."></span>
    <div class="spacer"></div>
    <div class="ticker-wrap">
      <input id="ticker-inp" type="text" placeholder="Ticker" autocomplete="off" spellcheck="false" maxlength="10">
      <select id="tf-inp" aria-label="Timeframe">
        <option value="1D">1D</option>
        <option value="1W">1W</option>
        <option value="1M">1M</option>
        <option value="3M">3M</option>
        <option value="6M" selected>6M</option>
        <option value="1Y">1Y</option>
        <option value="5Y">5Y</option>
      </select>
      <button class="btn--icon" id="live-btn" title="Toggle live stream" type="button">
        <i data-lucide="radio"></i>
      </button>
      <button class="btn--icon" id="chart-btn" title="Toggle chart" type="button">
        <i data-lucide="line-chart"></i>
      </button>
    </div>
  </header>

  <section class="app-main">
    <!-- ── CHAT ── -->
    <main class="chat" id="chat" aria-label="Conversation"></main>

    <!-- ── LIVE CANDLES PANEL ── -->
    <aside class="live-panel" id="live-panel" aria-label="Live candles panel">
      <div class="live-hdr">
        <i data-lucide="candlestick-chart"></i>
        <strong>Live Candles SSE</strong>
        <span class="live-status live-status--off" id="live-status">OFF</span>
      </div>
      <div class="live-wrap">
        <div class="live-metrics">
          <div class="live-metric"><span>Ticker</span><strong id="live-ticker">--</strong></div>
          <div class="live-metric"><span>Price</span><strong id="live-price">--</strong></div>
          <div class="live-metric"><span>Change</span><strong id="live-change">--</strong></div>
        </div>
        <div class="live-canvas-wrap">
          <canvas id="live-canvas"></canvas>
        </div>
        <div class="live-note" id="live-updated">Awaiting stream...</div>
      </div>
    </aside>
  </section>

  <!-- ── PORTFOLIO (hidden by default) ── -->
  <div class="portfolio-drawer" id="portfolio-drawer" style="display:none">
    <label>Cash<input id="cash-inp" type="number" min="0" step="100"></label>
    <label>Position<input id="pos-inp" type="number" min="0" step="1" placeholder="shares"></label>
    <label>Horizon<select id="horizon-inp">
        <option value="">--</option>
        <option value="days">Days</option>
        <option value="weeks">Weeks</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select></label>
    <label>Risk<select id="risk-inp">
        <option value="">--</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select></label>
  </div>

  <!-- ── BOTTOM BAR ── -->
  <div class="bottombar" id="bottombar">
    <button class="btn--sm" id="pf-btn" type="button" title="Portfolio">$</button>
    <textarea id="user-inp" rows="1" placeholder="Ask about a stock, strategy, or risk..."></textarea>
    <button class="btn btn--primary" id="send-btn" type="button">
      <i data-lucide="send"></i><span>Send</span>
    </button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // SuperEzio — Chat UI with full backend integration
    // Contracts: POST /task/submit (NDJSON stream), GET /api/chart-data/{ticker}, GET /health
    // ═══════════════════════════════════════════════════════════════

    const API = window.location.protocol === "file:" ? "http://127.0.0.1:8002" : "";
    const CHAT = document.getElementById("chat");
    const USER_INP = document.getElementById("user-inp");
    const SEND_BTN = document.getElementById("send-btn");
    const SYS_DOT = document.getElementById("sys-dot");
    const TICKER_INP = document.getElementById("ticker-inp");
    const TF_INP = document.getElementById("tf-inp");
    const LIVE_BTN = document.getElementById("live-btn");
    const CHART_BTN = document.getElementById("chart-btn");
    const PF_BTN = document.getElementById("pf-btn");
    const PF_DRAWER = document.getElementById("portfolio-drawer");
    const LIVE_STATUS = document.getElementById("live-status");
    const LIVE_TICKER = document.getElementById("live-ticker");
    const LIVE_PRICE = document.getElementById("live-price");
    const LIVE_CHANGE = document.getElementById("live-change");
    const LIVE_UPDATED = document.getElementById("live-updated");
    const LIVE_CANVAS = document.getElementById("live-canvas");

    const STEPS = ["orchestrator", "data", "pennylab", "experts", "f51", "ceo", "explanation"];
    const SOURCES = ["technicals", "profile", "quant", "risk", "sentiment", "reddit", "macro", "crisis", "realtime_price", "quantum"];
    const CRISIS_MODELS = {
      bis_credit_gap: "BIS Credit", markov_regime: "Markov", hawkes_stress: "Hawkes",
      lppls_bubble: "LPPLS", yield_curve: "Yield Curve", leverage_cycle: "Leverage",
      vol_clustering: "Vol", contagion: "Contagion", flight_quality: "Flight",
      illiquidity: "Illiquidity", sentiment_crisis: "Sentiment", macro_stress: "Macro"
    };

    let state = {
      health: false, ticker: "", chartData: null,
      portfolio: {}, stream: null, busy: false,
      live: { enabled: false, es: null, connected: false },
    };

    // ── Helpers ──
    function $(id) { return document.getElementById(id); }
    function pct(v) { return v != null ? Math.round(v * 100) + "%" : "--"; }
    function fmt(v, d = 2) { return v != null && isFinite(v) ? Number(v).toLocaleString("en-US", { maximumFractionDigits: d }) : "--"; }
    function fmtCompact(v) { if (v == null || !isFinite(v)) return "--"; if (v >= 1e12) return (v / 1e12).toFixed(1) + "T"; if (v >= 1e9) return (v / 1e9).toFixed(1) + "B"; if (v >= 1e6) return (v / 1e6).toFixed(1) + "M"; if (v >= 1e3) return (v / 1e3).toFixed(1) + "K"; return fmt(v, 0); }
    function stripThink(t) { return (t || "").replace(/<think[\s\S]*?<\/think>/gi, "").replace(/<think[\s\S]*$/gi, ""); }
    function sanitTicker(r) { return String(r || "").replace(/[^\w.\-^]/g, "").toUpperCase().slice(0, 18); }
    function lastVal(s) { return Array.isArray(s) && s.length ? s[s.length - 1]?.value ?? null : null; }
    async function fetchJson(path) { const r = await fetch(API + path, { headers: { Accept: "application/json" } }); if (!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }

    function setLiveStatus(label, mode = "off") {
      if (!LIVE_STATUS) return;
      LIVE_STATUS.textContent = label;
      LIVE_STATUS.className = `live-status live-status--${mode}`;
    }

    function mergeLiveCandle(payload) {
      if (!payload || !payload.latest) return;
      const latest = payload.latest;

      if (!state.chartData) {
        state.chartData = {
          ticker: payload.ticker,
          timeframe: payload.timeframe,
          ohlcv: [latest],
          indicators: {},
          profile: {},
          price: {},
        };
      }

      const arr = Array.isArray(state.chartData.ohlcv) ? state.chartData.ohlcv : [];
      const idx = arr.findIndex(c => c.time === latest.time);
      if (idx >= 0) arr[idx] = latest;
      else arr.push(latest);
      arr.sort((a, b) => a.time - b.time);
      state.chartData.ohlcv = arr.slice(-500);

      const curr = state.chartData.ohlcv[state.chartData.ohlcv.length - 1];
      const prev = state.chartData.ohlcv.length > 1 ? state.chartData.ohlcv[state.chartData.ohlcv.length - 2] : null;
      const ref = prev ? prev.close : curr.open;
      const change = curr.close - ref;
      state.chartData.price = {
        current: curr.close,
        previous_close: ref,
        change,
        change_pct: ref ? (change / ref) * 100 : 0,
      };
      state.chartData.ticker = payload.ticker || state.chartData.ticker;
      state.chartData.timeframe = payload.timeframe || state.chartData.timeframe;
    }

    function updateLiveMetricsFromChart() {
      const d = state.chartData;
      if (!d) return;
      LIVE_TICKER.textContent = d.ticker || "--";
      LIVE_PRICE.textContent = fmt(d.price?.current ?? d.ohlcv?.[d.ohlcv.length - 1]?.close, 4);
      const pctVal = d.price?.change_pct;
      LIVE_CHANGE.textContent = pctVal == null ? "--" : `${pctVal > 0 ? "+" : ""}${fmt(pctVal, 2)}%`;
      LIVE_CHANGE.style.color = pctVal == null ? "var(--ink)" : pctVal >= 0 ? "#2f7a4e" : "var(--red)";
    }

    function drawLiveCandles() {
      const d = state.chartData;
      if (!LIVE_CANVAS || !d || !Array.isArray(d.ohlcv) || d.ohlcv.length < 2) return;

      const candles = d.ohlcv.slice(-140);
      const lows = candles.map(c => Number(c.low)).filter(v => isFinite(v));
      const highs = candles.map(c => Number(c.high)).filter(v => isFinite(v));
      if (!lows.length || !highs.length) return;

      const min = Math.min(...lows);
      const max = Math.max(...highs);
      const range = Math.max(max - min, 1e-6);

      const wrap = LIVE_CANVAS.parentElement;
      const w = Math.max(280, (wrap?.clientWidth || 320) - 4);
      const h = 280;

      LIVE_CANVAS.width = w * 2;
      LIVE_CANVAS.height = h * 2;
      LIVE_CANVAS.style.width = `${w}px`;
      LIVE_CANVAS.style.height = `${h}px`;

      const ctx = LIVE_CANVAS.getContext("2d");
      ctx.setTransform(2, 0, 0, 2, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const padL = 10, padR = 6, padT = 8, padB = 20;
      const cw = w - padL - padR;
      const ch = h - padT - padB;
      const step = cw / candles.length;
      const bodyW = Math.max(2, Math.min(8, step * 0.65));

      ctx.strokeStyle = "rgba(17,21,16,0.08)";
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        const y = padT + (ch * i / 5);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + cw, y);
        ctx.stroke();
      }

      const yOf = (v) => padT + ch - ((v - min) / range) * ch;

      candles.forEach((c, i) => {
        const x = padL + i * step + step / 2;
        const o = Number(c.open), hV = Number(c.high), lV = Number(c.low), cl = Number(c.close);
        const up = cl >= o;
        const color = up ? "#2f7a4e" : "#c95757";

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, yOf(hV));
        ctx.lineTo(x, yOf(lV));
        ctx.stroke();

        const yOpen = yOf(o);
        const yClose = yOf(cl);
        const top = Math.min(yOpen, yClose);
        const bh = Math.max(1, Math.abs(yClose - yOpen));
        ctx.fillStyle = color;
        ctx.fillRect(x - bodyW / 2, top, bodyW, bh);
      });

      const last = candles[candles.length - 1];
      ctx.fillStyle = "#141a13";
      ctx.font = "11px JetBrains Mono";
      ctx.fillText(`last ${fmt(last.close, 4)}`, padL, h - 6);
      ctx.fillText(`${d.timeframe || "--"}`, w - 58, h - 6);
    }

    function stopLiveStream() {
      if (state.live.es) {
        state.live.es.close();
        state.live.es = null;
      }
      state.live.connected = false;
      setLiveStatus("OFF", "off");
    }

    function startLiveStream() {
      const ticker = sanitTicker(TICKER_INP.value);
      const tf = TF_INP.value || "1D";
      if (!ticker) {
        setLiveStatus("NO TICKER", "err");
        LIVE_UPDATED.textContent = "Provide a ticker to start SSE";
        return;
      }

      stopLiveStream();
      setLiveStatus("CONNECTING", "off");

      const url = `${API}/api/chart-sse/${encodeURIComponent(ticker)}?timeframe=${encodeURIComponent(tf)}&refresh_s=3&max_points=180`;
      const es = new EventSource(url);
      state.live.es = es;

      es.addEventListener("open", () => {
        state.live.connected = true;
        setLiveStatus("LIVE", "on");
        LIVE_UPDATED.textContent = "Connected to SSE stream";
      });

      es.addEventListener("snapshot", (evt) => {
        try {
          const payload = JSON.parse(evt.data || "{}");
          state.chartData = {
            ticker: payload.ticker,
            timeframe: payload.timeframe,
            ohlcv: Array.isArray(payload.ohlcv) ? payload.ohlcv : [],
            indicators: state.chartData?.indicators || {},
            profile: state.chartData?.profile || {},
            price: state.chartData?.price || {},
          };
          mergeLiveCandle(payload);
          updateLiveMetricsFromChart();
          drawLiveCandles();
          LIVE_UPDATED.textContent = `Snapshot ${new Date().toLocaleTimeString()}`;
        } catch (e) {
          console.warn("snapshot parse error", e);
        }
      });

      es.addEventListener("candle", (evt) => {
        try {
          const payload = JSON.parse(evt.data || "{}");
          mergeLiveCandle(payload);
          updateLiveMetricsFromChart();
          drawLiveCandles();
          LIVE_UPDATED.textContent = `Last candle ${new Date().toLocaleTimeString()}`;
        } catch (e) {
          console.warn("candle parse error", e);
        }
      });

      es.addEventListener("heartbeat", () => {
        LIVE_UPDATED.textContent = `Heartbeat ${new Date().toLocaleTimeString()}`;
      });

      es.addEventListener("error", (evt) => {
        let detail = "stream error";
        try { if (evt?.data) detail = JSON.parse(evt.data)?.detail || detail; } catch { }
        state.live.connected = false;
        setLiveStatus("RETRY", "err");
        LIVE_UPDATED.textContent = `SSE error: ${detail}`;
      });
    }

    // ── DOM helpers ──
    function el(tag, cls, attrs = {}) { const e = document.createElement(tag); if (cls) e.className = cls; Object.entries(attrs).forEach(([k, v]) => { if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v); }); return e; }

    // ── Health ──
    async function checkHealth() {
      try { const h = await fetchJson("/health"); state.health = h.status === "ok"; }
      catch (e) { state.health = false; }
      SYS_DOT.className = "status-dot " + (state.health ? "status-dot--on" : "status-dot--off");
      SYS_DOT.title = state.health ? "Connected" : "Disconnected";
    }

    // ── Chart Data ──
    async function loadChart(ticker, timeframe) {
      if (!ticker) return null;
      try {
        const d = await fetchJson(`/api/chart-data/${encodeURIComponent(ticker)}?timeframe=${encodeURIComponent(timeframe)}`);
        state.chartData = d; state.ticker = d.ticker || ticker; return d;
      } catch (e) { console.warn("Chart load failed:", e.message); return null; }
    }

    function buildChartContext() {
      const d = state.chartData;
      if (!d) return `Mode: Financial Copilot\nPortfolio: ${buildPortfolioContext()}`;
      const candles = d.ohlcv || []; const latest = candles[candles.length - 1] || {};
      const prev = candles.length > 1 ? candles[candles.length - 2] : null;
      const ix = d.indicators || {}; const p = d.price || {}; const pr = d.profile || {};
      const sma20 = lastVal(ix.sma20), sma50 = lastVal(ix.sma50), ema20 = lastVal(ix.ema20);
      const rsi = lastVal(ix.rsi), macd = lastVal(ix.macd), macdSig = lastVal(ix.macd_signal);
      const bbU = lastVal(ix.bb_upper), bbL = lastVal(ix.bb_lower);
      const avgVol = candles.slice(-20).reduce((s, c) => s + (c.volume || 0), 0) / Math.min(candles.length, 20);
      const body = latest.open != null && latest.close != null ? (latest.close - latest.open) : null;
      const candleDir = body == null ? "unknown" : body >= 0 ? "bullish" : "bearish";
      const wickUp = latest.high != null && latest.close != null ? (latest.high - Math.max(latest.open ?? latest.close, latest.close)) : null;
      const wickDown = latest.low != null && latest.close != null ? (Math.min(latest.open ?? latest.close, latest.close) - latest.low) : null;
      return [
        `Ticker: ${d.ticker}`, `Timeframe: ${d.timeframe}`, `Candles: ${candles.length}`,
        `Price: ${latest.close ?? "?"} | Change: ${p.change_pct ?? "?"}%`,
        `Latest candle: ${candleDir} | O:${latest.open ?? "?"} H:${latest.high ?? "?"} L:${latest.low ?? "?"} C:${latest.close ?? "?"}`,
        `Body: ${body ?? "?"} | Upper wick: ${wickUp ?? "?"} | Lower wick: ${wickDown ?? "?"}`,
        `Previous close: ${prev?.close ?? "?"} | Candle timestamp: ${latest.time ?? "?"}`,
        `RSI(14): ${rsi ?? "?"}`, `SMA20: ${sma20 ?? "?"}`, `SMA50: ${sma50 ?? "?"}`,
        `EMA20: ${ema20 ?? "?"}`, `MACD: ${macd ?? "?"} | Signal: ${macdSig ?? "?"}`,
        `BB Upper: ${bbU ?? "?"} | BB Lower: ${bbL ?? "?"}`,
        `Volume: ${latest.volume ?? "?"} | Avg20: ${Math.round(avgVol)}`,
        `Sector: ${pr.sector ?? "?"} | MCap: ${fmtCompact(pr.market_cap)}`,
        `P/E: ${pr.pe_ratio ?? "?"} | Currency: ${pr.currency ?? "USD"}`,
        `Portfolio: ${buildPortfolioContext()}`,
      ].join("\n");
    }

    // ── Portfolio ──
    function loadPf() { try { state.portfolio = JSON.parse(localStorage.getItem("superezio.pf") || "{}") || {}; } catch { state.portfolio = {}; } }
    function savePf() {
      state.portfolio = { cash: $("cash-inp")?.value || "", position: $("pos-inp")?.value || "", horizon: $("horizon-inp")?.value || "", risk: $("risk-inp")?.value || "" };
      localStorage.setItem("superezio.pf", JSON.stringify(state.portfolio));
    }
    function buildPortfolioContext() {
      const p = state.portfolio; const parts = [];
      if (p.cash) parts.push("cash=" + p.cash);
      if (p.position) parts.push("position=" + p.position);
      if (p.horizon) parts.push("horizon=" + p.horizon);
      if (p.risk) parts.push("risk=" + p.risk);
      return parts.length ? parts.join("; ") : "not provided";
    }
    function applyPfToForm() {
      $("cash-inp").value = state.portfolio.cash || ""; $("pos-inp").value = state.portfolio.position || "";
      $("horizon-inp").value = state.portfolio.horizon || ""; $("risk-inp").value = state.portfolio.risk || "";
    }

    // ── Chat messages ──
    function addMessage(role) {
      const msg = el("div", "msg msg-" + role);
      const bubble = el("div", "msg-bubble");
      const meta = el("div", "msg-meta");
      meta.innerHTML = `<span>${role === "user" ? "You" : "SuperEzio CEO"}</span><span>${new Date().toLocaleTimeString()}</span>`;
      msg.append(bubble, meta);
      CHAT.appendChild(msg);
      return { msg, bubble, meta, cards: new Map() };
    }

    let currentCEO = null; // the CEO message currently being streamed to

    function ensureCEOMessage() {
      if (!currentCEO || currentCEO.msg.dataset.done === "1") {
        currentCEO = addMessage("ceo");
        currentCEO.msg.dataset.done = "0";
        // thinking indicator
        const think = el("div", "thinking");
        think.innerHTML = "<span></span><span></span><span></span>";
        currentCEO.bubble.appendChild(think);
        currentCEO._think = think;
      }
      return currentCEO;
    }

    function finishCEOMessage() {
      if (!currentCEO) return;
      currentCEO.msg.dataset.done = "1";
      if (currentCEO._think) { currentCEO._think.remove(); currentCEO._think = null; }
    }

    // ── Card factory ──
    function makeCard(title, badgeText, badgeClass, icon) {
      const c = el("div", "card");
      const hdr = el("div", "card-hdr");
      hdr.innerHTML = `<i data-lucide="${icon || 'info'}" class="card-icon"></i> ${title}`;
      const badge = el("span", "card-badge card-badge--" + (badgeClass || "neutral"));
      badge.textContent = badgeText || "--";
      hdr.appendChild(badge);
      const body = el("div", "card-body");
      c.append(hdr, body);
      hdr.addEventListener("click", () => { c.classList.toggle("open"); });
      return { card: c, body, badge, hdr };
    }

    // ── Event renderers ──
    function renderF51(ev, ceo) {
      const { card, body, badge } = makeCard("F51 Verdict", ev.passed ? "PASS" : "FAIL", ev.passed ? "pass" : "fail", "shield-check");
      const conf = ev.confidence || 0;
      const circumference = 2 * Math.PI * 32;
      const offset = circumference * (1 - conf);
      const strokeClr = conf >= 0.7 ? "#6aa86c" : conf >= 0.4 ? "#d58a55" : "#c95757";
      body.innerHTML = `
    <div class="f51-ring-wrap">
      <svg class="f51-ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="32" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="36" cy="36" r="32" fill="none" stroke="${strokeClr}" stroke-width="6" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 36 36)"/><text x="36" y="40" text-anchor="middle" class="f51-ring-pct" fill="var(--ink)">${pct(conf)}</text></svg>
      <div class="f51-factors">${["veracity", "consensus", "proxy_reward", "robustness", "uncertainty", "danger"].map(k => {
        const v = (ev.factors || {})[k];
        const clr = k === "uncertainty" || k === "danger" ? "var(--red)" : "#6aa86c";
        return `<div class="f51-factor"><span>${k}</span><div class="f51-factor-bar"><div class="f51-factor-fill" style="width:${pct(v)};background:${clr}"></div></div><strong>${pct(v)}</strong></div>`;
      }).join("")}</div>
    </div>
    <div class="f51-hub"><span>Hub Risk</span><div class="f51-hub-bar"><div class="f51-hub-fill" style="width:${pct(ev.hub_risk_score || ev.hub_risk)};background:${(ev.hub_risk_score || ev.hub_risk) >= 0.7 ? 'var(--red)' : (ev.hub_risk_score || ev.hub_risk) >= 0.4 ? 'var(--amber)' : '#6aa86c'}"></div></div><strong>${pct(ev.hub_risk_score || ev.hub_risk)}</strong></div>
  `;
      ceo.bubble.appendChild(card);
    }

    function renderPennylab(ev, ceo) {
      const dec = ev.decision || "--";
      const dc = dec.toLowerCase().includes("bull") ? "pass" : dec.toLowerCase().includes("bear") ? "fail" : dec.toLowerCase().includes("no_trade") ? "neutral" : "warn";
      const { card, body } = makeCard("PennyLab", dec.replace(/_/g, " "), dc, "microscope");
      const scores = ev.scores || {};
      const keys = { whale_suspicion: "Whale", pump_probability: "Pump", trap_risk: "Trap", liquidity_risk: "Liquidity", expected_loss: "Loss" };
      body.innerHTML = `<div class="pl-scores">${Object.entries(keys).map(([k, lbl]) => {
        const v = scores[k]; const p = pct(v); const clr = v >= 0.6 ? "var(--red)" : v >= 0.3 ? "var(--amber)" : "#6aa86c";
        return `<div class="pl-score"><span>${lbl}</span><strong>${p}</strong><div class="pl-score-bar"><div class="pl-score-fill" style="width:${p};background:${clr}"></div></div></div>`;
      }).join("")}</div>`;
      ceo.bubble.appendChild(card);
    }

    function renderCrisis(ev, ceo) {
      const regime = ev.regime || ev.aggregate_regime || "--";
      const rc = regime.toLowerCase().includes("normal") ? "pass" : regime.toLowerCase().includes("stress") ? "warn" : "fail";
      const { card, body } = makeCard("Crisis Radar", regime, rc, "activity");
      const risk = ev.systemic_risk ?? ev.aggregate_risk ?? ev.aggregate_score ?? null;
      const alerts = ev.alerts || [];
      const models = ev.models || ev.individual_models || {};
      body.innerHTML = `
    <span class="crisis-regime-badge" style="background:${rc === 'pass' ? 'var(--green)' : rc === 'warn' ? 'var(--amber)' : 'var(--red)'};color:#fff">${regime}</span>
    <div class="crisis-bar"><span>Systemic</span><div class="crisis-bar-track"><div class="crisis-bar-fill" style="width:${pct(risk)}"></div></div><strong>${pct(risk)}</strong></div>
    ${alerts.length ? `<div class="crisis-alerts">${alerts.map(a => `<span class="crisis-alert" style="background:${(a.level || a.severity || '').toLowerCase() === 'red' ? 'var(--red)' : (a.level || a.severity || '').toLowerCase() === 'yellow' ? 'var(--amber)' : '#6aa86c'}">${a.name || a.message || a}</span>`).join("")}</div>` : ""}
    <div class="crisis-models">${Object.entries(CRISIS_MODELS).map(([k, lbl]) => {
        const v = models[k]; return `<div class="crisis-model"><span>${lbl}</span><strong>${v != null ? typeof v === "object" ? pct(v.score) : pct(v) : "--"}</strong></div>`;
      }).join("")}</div>
  `;
      ceo.bubble.appendChild(card);
    }

    function renderDataQuality(ev, ceo) {
      const q = ev.quality || "unknown";
      const qc = q === "ok" ? "pass" : q === "partial" ? "warn" : "fail";
      const { card, body } = makeCard("Data Quality", q, qc, "database");
      const srcs = ev.sources || ev.data_sources || {};
      body.innerHTML = `<div class="dq-grid">${SOURCES.map(s => {
        const info = srcs[s]; const st = info ? info.status || info : "waiting";
        const tileCls = st === "ok" || st === "provider_or_computed" ? "ok" : st === "partial" ? "partial" : st === "error" || st === "timeout" ? "error" : "";
        const dotCls = st === "ok" || st === "provider_or_computed" ? "ok" : st === "partial" ? "partial" : st === "error" || st === "timeout" ? "error" : "";
        return `<div class="dq-tile dq-tile--${tileCls}"><span class="dq-dot dq-dot--${dotCls || 'error'}"></span>${s}</div>`;
      }).join("")}</div>`;
      ceo.bubble.appendChild(card);
    }

    function renderPipelineBar(ceo) {
      // Keep a single pipeline bar updated
      let bar = ceo.bubble.querySelector(".pipeline-bar");
      if (!bar) {
        bar = el("div", "pipeline-bar");
        STEPS.forEach((s, i) => {
          const step = el("div", "pipeline-step");
          step.innerHTML = `<span class="pipeline-dot" id="pipe-dot-${s}"></span><span class="pipeline-label">${s.slice(0, 3)}</span>`;
          bar.appendChild(step);
          if (i < STEPS.length - 1) { const line = el("div", "pipeline-line"); line.id = "pipe-line-" + i; bar.appendChild(line); }
        });
        ceo.bubble.appendChild(bar);
      }
      return bar;
    }

    function updatePipelineStep(step, status, ceo) {
      const dot = document.getElementById("pipe-dot-" + step);
      if (dot) dot.className = "pipeline-dot pipeline-dot--" + status;
      // Update lines
      STEPS.forEach((s, i) => {
        if (i >= STEPS.length - 1) return;
        const line = document.getElementById("pipe-line-" + i);
        if (!line) return;
        const dotEl = document.getElementById("pipe-dot-" + STEPS[i]);
        const cls = dotEl?.className || "";
        if (cls.includes("done")) line.className = "pipeline-line pipeline-line--done";
        else if (cls.includes("running")) line.className = "pipeline-line pipeline-line--active";
        else if (cls.includes("error")) line.className = "pipeline-line";
      });
    }

    function updateExpertTile(role, status, provider, ceo) {
      let grid = ceo.bubble.querySelector(".exp-grid");
      if (!grid) {
        const { card, body } = makeCard("Experts", "0/12", "info", "users");
        grid = el("div", "exp-grid");
        const roles = ["fraud_hunter", "flow_analyst", "ruin_calculator", "sentiment_detective", "market_context", "dilution_scanner", "whale_tracker", "liquidity_scout", "hype_checker", "regulatory_radar", "valuation_skeptic", "survival_analyst"];
        const names = ["Fraud", "Flow", "Ruin", "Sentiment", "Market", "Dilution", "Whale", "Liquidity", "Hype", "Reg", "Valuation", "Survival"];
        roles.forEach((r, i) => {
          const t = el("div", "exp-tile"); t.id = "exp-" + r;
          t.innerHTML = `<span class="exp-dot"></span>${names[i]}`;
          grid.appendChild(t);
        });
        body.appendChild(grid);
        ceo.bubble.appendChild(card);
        ceo._expertCount = 0; ceo._expertTotal = 12;
      }
      const tile = document.getElementById("exp-" + role);
      if (!tile) return;
      tile.className = "exp-tile exp-tile--" + (status === "ok" || status === "done" ? "ok" : status === "fail" ? "fail" : status === "running" ? "running" : status === "skip" ? "skip" : "");
      const dot = tile.querySelector(".exp-dot");
      if (dot) dot.className = "exp-dot exp-dot--" + (status === "ok" || status === "done" ? "ok" : status === "fail" ? "fail" : status === "running" ? "running" : "");
      if (status === "ok" || status === "done") ceo._expertCount = (ceo._expertCount || 0) + 1;
      // Update badge
      const badge = ceo.bubble.querySelector(".card-badge--info");
      if (badge) badge.textContent = `${ceo._expertCount || 0}/${ceo._expertTotal || 12}`;
    }

    // ── STREAM HANDLER ──
    function handleEvent(ev) {
      if (!ev || !ev.type) return;

      switch (ev.type) {

        case "STREAM_START": {
          finishCEOMessage();
          const ceo = ensureCEOMessage();
          state.stream = { answer: "", explanation: "", events: [], decision: null, confidence: null };
          break;
        }

        case "CHART_DATA": {
          const ceo = currentCEO || ensureCEOMessage();
          const chip = el("span", "", { text: "📈 " + ev.ticker });
          chip.style.cssText = "display:inline-block;border-radius:99px;background:var(--blue-bg);color:var(--blue);padding:2px 10px;font-size:11px;font-weight:700;margin:4px 0;";
          ceo.bubble.appendChild(chip);
          if (state.chartData) renderChartCanvas(ceo);
          break;
        }

        case "CHUNK": {
          const ceo = ensureCEOMessage();
          if (ceo._think) { ceo._think.remove(); ceo._think = null; }
          state.stream.answer += ev.content || "";
          // Strip thinking blocks from display
          const clean = stripThink(state.stream.answer);
          ceo.bubble.childNodes.forEach(n => { if (n.nodeType === 3 || (n.nodeType === 1 && !n.classList.contains("card") && !n.classList.contains("pipeline-bar") && !n.classList.contains("thinking"))) n.remove(); });
          const textNode = document.createTextNode(clean);
          // Insert before first card or pipeline bar
          const firstExtra = ceo.bubble.querySelector(".card, .pipeline-bar");
          if (firstExtra) ceo.bubble.insertBefore(textNode, firstExtra);
          else ceo.bubble.appendChild(textNode);
          ceo.bubble.normalize();
          break;
        }

        case "EXPLANATION_CHUNK": {
          state.stream.explanation += ev.content || "";
          break;
        }

        case "INTENT_CLASSIFIED": {
          const ceo = currentCEO || ensureCEOMessage();
          const chip = el("span", "", { text: `${ev.intent || "?"} · ${ev.route || "?"} ${ev.confidence != null ? Math.round(ev.confidence * 100) + "%" : ""}` });
          chip.style.cssText = "display:inline-block;font-size:10px;color:var(--muted);margin:2px 0;";
          ceo.meta.appendChild(chip);
          break;
        }

        case "PIPELINE_STEP": {
          if (ev.status === "skipped_duplicate") break;
          const ceo = currentCEO || ensureCEOMessage();
          renderPipelineBar(ceo);
          const stepMap = { orchestrator: "orchestrator", data_collection: "data", data: "data", pennylab: "pennylab", penny_lab: "pennylab", experts: "experts", expert_analysis: "experts", f51: "f51", f51_engine: "f51", ceo: "ceo", llm: "ceo", explanation: "explanation" };
          const s = stepMap[ev.step] || ev.step;
          if (STEPS.includes(s)) updatePipelineStep(s, ev.status || "started", ceo);
          break;
        }

        case "F51_VERDICT": {
          const ceo = currentCEO || ensureCEOMessage();
          renderF51(ev, ceo);
          break;
        }

        case "PENNYLAB_ANALYSIS": {
          const ceo = currentCEO || ensureCEOMessage();
          renderPennylab(ev, ceo);
          break;
        }

        case "CRISIS_MATH": {
          const ceo = currentCEO || ensureCEOMessage();
          renderCrisis(ev, ceo);
          break;
        }

        case "DATA_COLLECTED": {
          const ceo = currentCEO || ensureCEOMessage();
          renderDataQuality(ev, ceo);
          break;
        }

        case "EXPERT_STARTED": {
          const ceo = currentCEO || ensureCEOMessage();
          updateExpertTile(ev.role, "running", ev.provider, ceo);
          break;
        }

        case "EXPERT_DONE": {
          const ceo = currentCEO || ensureCEOMessage();
          updateExpertTile(ev.role, ev.ok !== false ? "ok" : "fail", ev.provider, ceo);
          break;
        }

        case "EXPERT_SKIPPED": {
          const ceo = currentCEO || ensureCEOMessage();
          updateExpertTile(ev.role, "skip", ev.provider, ceo);
          break;
        }

        case "MODEL_MISSING": {
          const ceo = currentCEO || ensureCEOMessage();
          const warn = el("span", "", { text: `⚠ ${ev.role || "?"} unavailable` });
          warn.style.cssText = "display:inline-block;font-size:10px;color:var(--amber);margin:2px 0;";
          ceo.meta.appendChild(warn);
          break;
        }

        case "ERROR": {
          const ceo = currentCEO || ensureCEOMessage();
          const err = el("div", "");
          err.style.cssText = "color:var(--red);font-size:12px;font-weight:600;margin-top:4px;";
          err.textContent = "Error: " + (ev.detail || "Unknown");
          ceo.bubble.appendChild(err);
          break;
        }

        case "STREAM_END": {
          finishCEOMessage();
          state.busy = false;
          SEND_BTN.disabled = false;
          USER_INP.disabled = false;
          USER_INP.focus();
          // Save to journal
          if (state.stream && state.stream.answer) {
            const journal = JSON.parse(localStorage.getItem("superezio.journal") || "[]");
            journal.unshift({
              at: new Date().toISOString(), ticker: state.ticker,
              prompt: state.stream.prompt, answer: stripThink(state.stream.answer),
            });
            localStorage.setItem("superezio.journal", JSON.stringify(journal.slice(0, 30)));
          }
          break;
        }

        default:
          // Unknown event — log to console only
          console.debug("Unhandled event:", ev.type, ev);
      }

      CHAT.scrollTop = CHAT.scrollHeight;
    }

    // ── Chart Canvas ──
    function renderChartCanvas(ceo) {
      const d = state.chartData;
      if (!d) return;
      const { card, body } = makeCard("Chart: " + d.ticker, d.timeframe, "info", "line-chart");
      card.classList.add("chart-card");
      const canvas = el("canvas", "");
      canvas.width = 900; canvas.height = 220;
      body.appendChild(canvas);
      ceo.bubble.appendChild(card);

      requestAnimationFrame(() => {
        const ctx = canvas.getContext("2d");
        const w = canvas.parentElement.clientWidth - 24;
        const h = 220;
        canvas.width = w * 2; canvas.height = h * 2;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.setTransform(2, 0, 0, 2, 0, 0);
        ctx.fillStyle = "#fbfcfa"; ctx.fillRect(0, 0, w, h);
        const candles = d.ohlcv || [];
        if (candles.length < 2) { ctx.fillStyle = "var(--muted)"; ctx.font = "12px sans-serif"; ctx.fillText("No data", 10, 20); return; }
        const closes = candles.map(c => Number(c.close)).filter(v => isFinite(v));
        const min = Math.min(...closes), max = Math.max(...closes), range = max - min || 1;
        const pad = 14, cw = w - pad * 2, ch = h - pad * 2;
        // SMA20
        if (closes.length > 20) {
          ctx.strokeStyle = "rgba(59,111,160,0.35)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath();
          for (let i = 19; i < closes.length; i++) { let s = 0; for (let j = i - 19; j <= i; j++) s += closes[j]; const avg = s / 20; const x = pad + cw * i / (closes.length - 1); const y = pad + ch - (avg - min) / range * ch; if (i === 19) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); ctx.setLineDash([]);
        }
        // Price
        ctx.strokeStyle = "#3b6fa0"; ctx.lineWidth = 2; ctx.beginPath();
        candles.forEach((c, i) => { const x = pad + cw * i / (candles.length - 1); const y = pad + ch - (Number(c.close) - min) / range * ch; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }); ctx.stroke();
        ctx.fillStyle = "var(--ink)"; ctx.font = "11px JetBrains Mono"; ctx.fillText("hi " + fmt(max, 2), pad, 12); ctx.fillText("lo " + fmt(min, 2), pad, h - 8);
      });
    }

    // ── Submit ──
    async function submit(msg) {
      if (state.busy) return;
      state.busy = true; SEND_BTN.disabled = true; USER_INP.disabled = true;

      ensureCEOMessage();
      currentCEO._think?.remove?.();
      currentCEO = null; // force new CEO message for this run
      finishCEOMessage();

      // Add user message
      const um = addMessage("user");
      um.bubble.textContent = msg;

      const ticker = sanitTicker(TICKER_INP.value) || "";
      const tf = TF_INP.value || "6M";

      // Load chart if ticker entered
      if (ticker && (!state.chartData || state.chartData.ticker !== ticker)) {
        await loadChart(ticker, tf);
      }

      const envelope = {
        version: "a2a/1.0", msg_id: "chat-" + Date.now(), from: "chat", to: "agent_server",
        type: "TASK.SUBMIT",
        payload: { message: msg, session_id: "chat-" + crypto.randomUUID?.() ?? Date.now(), rigor: "strict", ticker, chart_context: buildChartContext() },
      };

      try {
        const resp = await fetch(API + "/task/submit", {
          method: "POST", headers: { Accept: "application/x-ndjson", "Content-Type": "application/json" },
          body: JSON.stringify(envelope),
        });
        if (!resp.ok) throw new Error("/task/submit " + resp.status);
        if (!resp.body) {
          const txt = await resp.text();
          const ceo = ensureCEOMessage();
          ceo.bubble.textContent = txt;
          finishCEOMessage();
          state.busy = false; SEND_BTN.disabled = false; USER_INP.disabled = false;
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop() || "";
          for (const line of lines) {
            const trimmed = line.trim(); if (!trimmed) continue;
            try { handleEvent(JSON.parse(trimmed)); } catch (e) { console.warn("Parse error:", e); }
          }
        }
        if (buf.trim()) { try { handleEvent(JSON.parse(buf.trim())); } catch { } }
      } catch (e) {
        const ceo = ensureCEOMessage();
        ceo.bubble.appendChild(el("div", "", { text: "Error: " + e.message, style: "color:var(--red);font-weight:600" }));
        finishCEOMessage();
        state.busy = false; SEND_BTN.disabled = false; USER_INP.disabled = false;
      }
    }

    // ── Wiring ──
    SEND_BTN.addEventListener("click", () => {
      const msg = USER_INP.value.trim(); if (!msg || state.busy) return;
      USER_INP.value = ""; USER_INP.style.height = "auto";
      submit(msg);
    });

    USER_INP.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); SEND_BTN.click(); }
    });
    USER_INP.addEventListener("input", () => {
      USER_INP.style.height = "auto"; USER_INP.style.height = Math.min(USER_INP.scrollHeight, 120) + "px";
    });

    TICKER_INP.addEventListener("change", async () => {
      const t = sanitTicker(TICKER_INP.value); if (!t) return;
      TICKER_INP.value = t;
      await loadChart(t, TF_INP.value || "6M");
      if (state.live.enabled) startLiveStream();
    });

    TF_INP.addEventListener("change", async () => {
      const t = sanitTicker(TICKER_INP.value);
      if (t) await loadChart(t, TF_INP.value || "6M");
      if (state.live.enabled) startLiveStream();
    });

    LIVE_BTN.addEventListener("click", () => {
      state.live.enabled = !state.live.enabled;
      LIVE_BTN.style.borderColor = state.live.enabled ? "#86c399" : "var(--line)";
      LIVE_BTN.style.background = state.live.enabled ? "#eef9f0" : "var(--surface)";
      if (state.live.enabled) startLiveStream();
      else stopLiveStream();
    });

    CHART_BTN.addEventListener("click", async () => {
      const t = sanitTicker(TICKER_INP.value); if (!t) return;
      const d = await loadChart(t, TF_INP.value || "6M");
      updateLiveMetricsFromChart();
      drawLiveCandles();
      if (d && currentCEO) renderChartCanvas(currentCEO);
    });

    PF_BTN.addEventListener("click", () => {
      const visible = PF_DRAWER.style.display !== "none";
      PF_DRAWER.style.display = visible ? "none" : "grid";
      if (!visible) { loadPf(); applyPfToForm(); }
    });

    // Save portfolio on change
    ["cash-inp", "pos-inp", "horizon-inp", "risk-inp"].forEach(id => {
      const el = document.getElementById(id); if (el) el.addEventListener("change", savePf);
    });

    window.addEventListener("beforeunload", () => {
      stopLiveStream();
    });

    // ── Boot ──
    loadPf(); applyPfToForm();
    checkHealth(); setInterval(checkHealth, 30000);
    // Load chart if ticker pre-filled
    (async () => {
      const t = sanitTicker(TICKER_INP.value);
      if (t) await loadChart(t, TF_INP.value || "6M");
      updateLiveMetricsFromChart();
      drawLiveCandles();
      // Auto-focus input
      USER_INP.focus();
    })();
  </script>
</body>

</html>
