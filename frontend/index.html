<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperÉzio — Bob CEO Terminal</title>
<style>
:root{--bg:#0a0a12;--card:#12121f;--border:#1e1e35;--green:#00d4aa;--red:#ff4466;--yellow:#ffaa22;--text:#c8c8d0;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;display:flex;height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:8px}
.sidebar h1{color:var(--green);font-size:18px;margin-bottom:8px}
.sidebar .status{font-size:11px;padding:6px 10px;border-radius:6px;display:flex;align-items:center;gap:6px}
.sidebar .status .dot{width:8px;height:8px;border-radius:50%}
.sidebar .status.online{background:#0a2a1a}.sidebar .status.online .dot{background:var(--green)}
.sidebar .status.offline{background:#2a0a0a}.sidebar .status.offline .dot{background:var(--red)}
.sidebar button{background:var(--border);border:none;color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px}
.sidebar button:hover{background:#2a2a45}
.main{flex:1;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:8px;max-width:80%;font-size:14px;line-height:1.5}
.msg.user{background:var(--border);align-self:flex-end}
.msg.bob{background:#0a1a2a;border:1px solid #1a3a5a;align-self:flex-start}
.msg.bob .ticker{color:var(--green);font-weight:700}
.msg.bob .price{color:var(--yellow)}
.msg.bob .stop{color:var(--red)}
.input-area{display:flex;padding:12px 20px;gap:8px;border-top:1px solid var(--border);background:var(--card)}
.input-area input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;outline:none}
.input-area input:focus{border-color:var(--green)}
.input-area button{background:var(--green);color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer}
.input-area button:hover{opacity:.9}
.metrics{display:flex;gap:12px;padding:8px 20px;font-size:11px;color:var(--muted)}
.metrics span{color:var(--green)}
.typing{color:var(--yellow);font-size:12px;padding:0 20px}
</style>
</head>
<body>
<div class="sidebar">
  <h1>🧠 SuperÉzio</h1>
  <div class="status" id="bob-status"><span class="dot"></span> Bob CEO</div>
  <div class="status" id="api-status"><span class="dot"></span> API Server</div>
  <div class="status" id="freeze-status"><span class="dot"></span> FREEZE</div>
  <button onclick="quickAsk('NVDA — entry e stop?')">📊 NVDA trade</button>
  <button onclick="quickAsk('USIO — analise rapida')">🔬 USIO microcap</button>
  <button onclick="quickAsk('Top 3 small caps momentum hoje')">🔍 Market scan</button>
  <button onclick="quickAsk('AAPL — decide BUY/WAIT')">🍎 AAPL</button>
  <button onclick="quickAsk('Portfolio status')">💼 Portfolio</button>
  <div style="margin-top:auto;font-size:11px;color:var(--muted)">
    v4.0.0 · Qwen 80B<br>
    <span id="uptime">--</span>
  </div>
</div>
<div class="main">
  <div class="metrics">
    <span id="metric-freeze">FREEZE: --</span> |
    <span id="metric-tickers">389 tickers</span> |
    <span id="metric-cache">50K candles</span> |
    <span id="metric-latency">lat: --</span>
  </div>
  <div class="chat" id="chat">
    <div class="msg bob">👋 Bob CEO online. Qwen 80B local. 389 tickers. 50K candles. Manda o trade.</div>
  </div>
  <div class="typing" id="typing" style="display:none">Bob está pensando...</div>
  <div class="input-area">
    <input id="user-input" placeholder="Pergunte ao Bob..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Enviar</button>
  </div>
</div>
<script>
const API = "http://127.0.0.1:8002";

async function checkStatus() {
  try {
    const m = await (await fetch(API + "/metrics")).json();
    const freeze = m.trading_frozen;
    document.getElementById("freeze-status").className = "status " + (freeze ? "online" : "offline");
    document.getElementById("freeze-status").innerHTML = '<span class="dot"></span> FREEZE: ' + (freeze ? "ON" : "OFF");
    document.getElementById("metric-freeze").textContent = "FREEZE: " + (freeze ? "ON" : "OFF");
    
    const h = await (await fetch(API + "/health")).json();
    if (h.status === "ok") {
      document.getElementById("api-status").className = "status online";
      document.getElementById("api-status").innerHTML = '<span class="dot"></span> API: ONLINE';
    }
    document.getElementById("uptime").textContent = "up " + Math.round((m.uptime_seconds||0)/3600) + "h";
  } catch(e) {
    document.getElementById("api-status").className = "status offline";
    document.getElementById("api-status").innerHTML = '<span class="dot"></span> API: OFFLINE';
  }
}

async function send() {
  const input = document.getElementById("user-input");
  const msg = input.value.trim();
  if (!msg) return;
  
  const chat = document.getElementById("chat");
  chat.innerHTML += '<div class="msg user">' + msg + '</div>';
  input.value = "";
  document.getElementById("typing").style.display = "block";
  
  const t0 = Date.now();
  try {
    const resp = await fetch(API + "/task/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        version: "a2a/1.0", msg_id: crypto.randomUUID(),
        from: "web", to: "bob-ceo", type: "TASK.SUBMIT",
        timestamp: Date.now()/1000,
        payload: {message: msg, session_id: "web"}
      })
    });
    const raw = await resp.text();
    const lines = raw.split("\n").filter(l => l.trim());
    
    let bobText = "";
    for (const l of lines) {
      try {
        const e = JSON.parse(l);
        if (e.type === "CHUNK") bobText += e.content || "";
      } catch {}
    }
    
    const elapsed = ((Date.now() - t0)/1000).toFixed(0);
    document.getElementById("metric-latency").textContent = "lat: " + elapsed + "s";
    
    const formatted = bobText
      .replace(/\$(\d+\.\d+)/g, '<span class="price">$$$1</span>')
      .replace(/\b(BUY|SELL|WAIT|AVOID)\b/gi, '<span class="ticker">$1</span>')
      .replace(/\b(stop|entry|target)\b/gi, '<span class="stop">$1</span>');
    
    chat.innerHTML += '<div class="msg bob">' + (formatted || bobText || "Bob não respondeu.") + '</div>';
  } catch(e) {
    chat.innerHTML += '<div class="msg bob">Erro: ' + e.message + '</div>';
  }
  
  document.getElementById("typing").style.display = "none";
  chat.scrollTop = chat.scrollHeight;
  checkStatus();
}

function quickAsk(msg) {
  document.getElementById("user-input").value = msg;
  send();
}

setInterval(checkStatus, 30000);
checkStatus();
</script>
</body>
</html>
