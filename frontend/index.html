<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperEzio â€” AI Financial Copilot</title>
  <meta name="description" content="SuperEzio AI copilot: F51 verdict engine, evidence-based financial analysis.">
  <meta name="theme-color" content="#0a0e0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pipeline.css">
  <link rel="stylesheet" href="css/indicators.css">
  <link rel="stylesheet" href="css/sdca.css">
  <link rel="stylesheet" href="css/pennylab.css">
  <link rel="stylesheet" href="css/crisis.css">
  <link rel="stylesheet" href="css/data-quality.css">
  <link rel="stylesheet" href="css/experts.css">
  <link rel="stylesheet" href="css/charts.css">
</head>
<body>

  <!-- â”€â”€ TOP BAR â”€â”€ -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">SE</span>
      <span class="logo-text">SuperEzio</span>
      <span class="logo-sub">Market Command</span>
      <span class="status-dot status-dot--off" id="sys-dot" title="Checking..."></span>
    </div>
    <div class="spacer"></div>
    <div class="ticker-wrap">
      <input id="ticker-inp" type="text" placeholder="Ticker" value="AAPL" autocomplete="off" spellcheck="false" maxlength="10">
      <select id="tf-inp" aria-label="Timeframe">
        <option value="1D">1D</option>
        <option value="1W">1W</option>
        <option value="1M">1M</option>
        <option value="3M">3M</option>
        <option value="6M" selected>6M</option>
        <option value="1Y">1Y</option>
        <option value="5Y">5Y</option>
      </select>
      <button class="btn--icon" id="chart-btn" title="Reload chart" type="button"><i data-lucide="refresh-cw"></i></button>
      <button class="btn--icon" id="sdca-lab-btn" title="Cognitive Risk Firewall Lab" type="button"><i data-lucide="shield-alert"></i></button>
    </div>
  </header>

  <!-- â”€â”€ MAIN â”€â”€ -->
  <section class="app-main">
    <aside class="right-stack" id="live-panel" aria-label="Bob conversation">
      <section class="terminal-card terminal-card--chat">
        <div class="terminal-card-hdr">
          <i data-lucide="brain-circuit"></i>
          <strong>Bob CEO</strong>
          <span id="live-ticker">AAPL</span>
        </div>
        <main class="chat" id="chat" aria-label="Conversation">
          <section class="bob-welcome">
            <div class="bob-copy">
              <strong>Bob is online.</strong>
              <p>Ask directly. Market context is attached when your question needs the chart.</p>
            </div>
          </section>
        </main>
        <div class="bottombar" id="bottombar">
          <textarea id="user-inp" rows="1" placeholder="Ask Bob..." autocomplete="off" spellcheck="true"></textarea>
          <button class="btn btn--primary" id="send-btn" type="button"><i data-lucide="send"></i><span>Send</span></button>
        </div>
      </section>
    </aside>

    <main class="chart-workspace" aria-label="Trading workspace">
      <div class="market-header">
        <div class="asset-block">
          <span class="asset-label">Live market</span>
          <h1><span id="workspace-ticker">AAPL</span><small id="workspace-tf">6M</small></h1>
          <div class="live-profile" id="live-profile"></div>
        </div>
        <div class="price-strip">
          <div><span>Last</span><strong id="live-price">--</strong></div>
          <div><span>Change</span><strong id="live-change">--</strong></div>
          <div><span>Stream</span><strong class="live-status live-status--off" id="live-status">OFF</strong></div>
        </div>
      </div>

      <section class="chart-stage">
        <div class="live-canvas-wrap"><canvas id="live-canvas"></canvas></div>
      </section>
    </main>

  </section>

  <!-- â”€â”€ SDCA LAB â”€â”€ -->
  <section class="sdca-lab" id="sdca-lab" aria-hidden="true">
    <div class="sdca-lab-hdr">
      <div><span>F51 Labs</span><strong>Cognitive Risk Firewall</strong></div>
      <button class="btn--icon" id="sdca-lab-close" type="button"><i data-lucide="x"></i></button>
    </div>
    <div class="sdca-lab-body">
      <form class="sdca-lab-form" id="sdca-form">
        <div class="sdca-lab-grid">
          <label>Decision ID<input id="sdca-id" type="text" autocomplete="off"></label>
          <label>Source<select id="sdca-source"><option value="manual">manual</option><option value="agent">agent</option><option value="operator">operator</option></select></label>
          <label>Asset<input id="sdca-asset" type="text" autocomplete="off"></label>
          <label>Action<input id="sdca-action" type="text" autocomplete="off"></label>
          <label>Amount CAD<input id="sdca-amount" type="number" min="0" step="1"></label>
          <label>2h Change %<input id="sdca-price-change" type="number" step="0.1"></label>
        </div>
        <label class="sdca-lab-wide">Thesis<textarea id="sdca-thesis" rows="3"></textarea></label>
        <div class="sdca-lab-grid">
          <label>Latency<select id="sdca-latency"><option value="low">low</option><option value="normal">normal</option><option value="high">high</option></select></label>
          <label>Spread<select id="sdca-spread"><option value="tight">tight</option><option value="normal">normal</option><option value="wide">wide</option></select></label>
          <label>Social Hype<select id="sdca-hype"><option value="low">low</option><option value="normal">normal</option><option value="high">high</option></select></label>
          <label>Data Quality<select id="sdca-data-quality"><option value="high">high</option><option value="normal">normal</option><option value="low">low</option></select></label>
        </div>
        <div class="sdca-lab-checks">
          <label><input id="sdca-fomo" type="checkbox"> FOMO</label>
          <label><input id="sdca-leverage" type="checkbox"> Leverage</label>
          <label><input id="sdca-slippage" type="checkbox"> Slippage risk</label>
          <label><input id="sdca-stale" type="checkbox"> Stale signal</label>
        </div>
        <div class="sdca-lab-actions">
          <button class="btn--sm" id="sdca-preset-fomo" type="button">FOMO preset</button>
          <button class="btn--sm" id="sdca-preset-safe" type="button">Conservative preset</button>
          <button class="btn btn--primary" id="sdca-run-btn" type="button"><i data-lucide="shield-check"></i><span>Evaluate</span></button>
        </div>
      </form>
      <div class="sdca-lab-result" id="sdca-result">
        <div class="sdca-lab-empty">Ready for local firewall evaluation.</div>
      </div>
    </div>
  </section>

  <!-- JS (dependency order) -->
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/render-pipeline.js"></script>
  <script src="js/render-f51.js"></script>
  <script src="js/render-sdca.js"></script>
  <script src="js/render-pennylab.js"></script>
  <script src="js/render-crisis.js"></script>
  <script src="js/render-data-quality.js"></script>
  <script src="js/render-experts.js"></script>
  <script src="js/render-neural.js"></script>
  <script src="js/render-explanation.js"></script>
  <script src="js/render-chart.js"></script>
  <script src="js/render-candles.js"></script>
  <script src="js/render-profile.js"></script>
  <script src="js/live.js"></script>
  <script src="js/sdca-lab.js"></script>
  <script src="js/events.js"></script>
  <script src="js/health.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
